<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Murmur</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cpath%20fill%3D%22%2314c8a0%22%20d%3D%22M32%206C17.6%206%206%2016.4%206%2029.5c0%206.2%202.6%2011.8%206.9%2016L10%2057l11.3-5.6c3.4%201.2%207%201.8%2010.7%201.8%2014.4%200%2026-10.4%2026-23.5S46.4%206%2032%206z%22/%3E%3Cpath%20fill%3D%22none%22%20stroke%3D%22%2304261e%22%20stroke-width%3D%224.4%22%20stroke-linecap%3D%22round%22%20d%3D%22M20%2040V33c0-4%202.5-6.5%206-6.5s6%202.5%206%206.5v7M32%2033c0-4%202.5-6.5%206-6.5s6%202.5%206%206.5v7%22%20transform%3D%22translate%280%20-2.5%29%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef1f5;--panel:#fbfcfe;--ink:#2c3e55;--mute:#6b7a8c;--line:#dde3ea;--in:#e8edf3;--hover:#e1e8f0;--f:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161b22;--panel:#1d242d;--ink:#dbe5f0;--mute:#8d9bad;--line:#2d3744;--in:#262f3a;--hover:#2b3541}}
:root[data-theme="dark"]{--bg:#161b22;--panel:#1d242d;--ink:#dbe5f0;--mute:#8d9bad;--line:#2d3744;--in:#262f3a;--hover:#2b3541}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:var(--f);background:var(--bg);color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
.gs{}
@keyframes pop{from{transform:scale(0);opacity:0}}
@keyframes vin{from{opacity:0;transform:translateY(12px)}}
@keyframes wob{50%{transform:rotate(-14deg) scale(1.1)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.shake{animation:shake .4s}
.mk{width:40px;height:40px;background:var(--ink);border-radius:50% 50% 50% 10px;flex:none}
.btn{background:var(--ink);color:var(--bg);border-radius:10px;padding:13px;font-weight:700;font-size:16px;transition:.2s;width:100%}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.out{background:none;color:var(--ink);border:2px solid var(--ink)}
.btn.sm{width:auto;padding:9px 18px;font-size:14px}
.in2,.fld input,.fld select,.fld textarea{font:inherit;width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);outline:0;transition:.2s}
.in2:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--hover)}
.er{color:var(--ink);font-size:14px;font-weight:600;min-height:0}
.er:not(:empty)::before{content:"! ";font-weight:800}
/* auth */
#auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;animation:vin .5s both}
.ah{display:flex;gap:60px;align-items:center;justify-content:space-between;max-width:980px;width:100%}
.aw h1{font-size:68px;font-weight:800;letter-spacing:-.06em;line-height:1;display:flex;align-items:center;gap:14px}
.aw p{font-size:24px;line-height:1.25;max-width:440px;margin-top:12px}
.ac{width:400px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 2px 4px #0002,0 8px 20px #0001}
.ac a{text-align:center;font-size:14px;cursor:pointer;text-decoration:underline;color:var(--mute)}.ac a:hover{color:var(--ink)}
.ac hr{border:0;border-top:1px solid var(--line)}
.pw{position:relative}.pw .eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);padding:6px;filter:grayscale(1)}
/* header */
#app{height:100%;display:flex;flex-direction:column}
.hb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:58px;padding:0 14px;gap:10px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:10}
.hl{display:flex;gap:10px;align-items:center}
.sw{position:relative}.sw input{background:var(--in);border:0;border-radius:22px;padding:10px 16px;width:230px;color:var(--ink);outline:0}
.dd{position:absolute;top:calc(100% + 8px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px #0003;min-width:260px;padding:8px;z-index:50;animation:pop .2s;transform-origin:top}
.menu{right:0;min-width:290px}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:8px;text-align:left;font-weight:600}.mi:hover{background:var(--hover)}
.tabs{display:flex;gap:6px;height:100%}
.tb{width:clamp(56px,9vw,110px);height:100%;display:grid;place-items:center;position:relative;color:var(--mute);border-radius:8px;transition:.2s}
.tb svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb:hover{background:var(--hover)}.tb.on{color:var(--ink)}
.tb.on::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:3px;background:var(--ink);border-radius:3px 3px 0 0;animation:grow .3s}
@keyframes grow{from{transform:scaleX(0)}}
.tb.on svg{animation:bump .4s}@keyframes bump{40%{transform:scale(1.25)}}
.nbd{position:absolute;top:8px;right:22%;min-width:19px;height:19px;border-radius:10px;background:var(--ink);color:var(--bg);border:2px solid var(--panel);font-size:11px;display:grid;place-items:center;padding:0 4px;font-weight:700;animation:pop .4s cubic-bezier(.3,1.8,.5,1)}
.hr{justify-self:end;position:relative}
.views{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none;overflow:auto;animation:vin .35s both}
.view.on{display:block}
#v-chats.on{display:grid;grid-template-columns:340px 1fr;overflow:hidden;background:var(--panel)}
#v-reels.on{display:flex;flex-direction:column;background:#1d242d;color:#fff;overflow:hidden}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.home{display:grid;grid-template-columns:minmax(0,290px) minmax(0,640px) minmax(0,290px);justify-content:center;gap:24px;padding:18px 14px;align-items:start}
.lc,.rc{position:sticky;top:18px}
.rc h3,.lc h3{font-size:16px;color:var(--mute);margin:2px 8px 8px}
.col{max-width:680px;margin:0 auto;padding:18px 14px}
.av{width:44px;height:44px;border-radius:50% 50% 50% 13px;display:grid;place-items:center;font-weight:800;background:var(--ink);color:var(--bg);flex:none;position:relative;font-size:16px}
.av.w{background:var(--panel);color:var(--ink);border:2px solid var(--ink)}
.av.on::after{content:"";position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:50%;background:var(--panel);border:3px solid var(--ink)}
.av.w.on::after{background:var(--ink);border-color:var(--panel)}
.av.s{width:40px;height:40px;font-size:14px}.av.l{width:110px;height:110px;font-size:40px;border-width:5px;border-color:var(--panel)}
.st{display:flex;gap:12px;overflow:auto;padding:2px 2px 14px}
.sy{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;flex:none;width:64px;cursor:pointer}
.sr{width:62px;height:62px;border-radius:50%;padding:3px;border:2.5px solid var(--ink);display:grid;place-items:center;transition:.3s}
.sr .av{width:100%;height:100%}
.sy:hover .sr{transform:scale(1.08) rotate(-6deg)}
.sy.seen .sr{border-style:dashed;border-color:var(--mute);opacity:.6}
.cmp{display:flex;gap:10px;align-items:center}
.cmp input{flex:1;border:0;background:var(--in);border-radius:22px;padding:11px 16px;color:var(--ink);outline:0}
.post{animation:pin .5s cubic-bezier(.2,1.1,.4,1) both}
@keyframes pin{from{opacity:0;transform:translateY(24px) scale(.96)}}
.ph{display:flex;gap:12px;align-items:center;margin-bottom:10px}.ph b{display:block}.ph small{color:var(--mute)}
.post p{line-height:1.45;font-size:16px;margin-bottom:10px}
.pic{height:240px;border-radius:12px;overflow:hidden;position:relative;margin-bottom:10px;background:#000}
.pa{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.pa button{padding:8px 14px;border-radius:8px;font-weight:600;flex:1;transition:.2s}
.pa button:hover{background:var(--hover)}.pa .on{background:var(--ink);color:var(--bg)}
.pa .on span{display:inline-block;animation:heart .5s}
@keyframes heart{30%{transform:scale(1.7)}}
.cms{padding-top:10px;display:flex;flex-direction:column;gap:8px}
.cc{background:var(--in);border-radius:16px;padding:8px 13px;font-size:14px;align-self:flex-start;animation:pin .3s both}.cc b{margin-right:6px}
.cms input{border:1px solid var(--line);border-radius:18px;padding:10px 14px;background:var(--panel);color:var(--ink);outline:0}
.cms input:focus,.search input:focus,.bar input:focus{border-color:var(--ink)}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:10px;text-align:left;font-weight:600;transition:.2s}
.row:hover{background:var(--hover);transform:translateX(3px)}
.row .btn{margin-left:auto}
/* profile */
.cv{height:210px;position:relative;overflow:hidden;border-radius:0 0 14px 14px;background:#000}
.pi{display:flex;gap:18px;align-items:flex-end;padding:0 24px;margin:-44px 0 18px;flex-wrap:wrap}
.pi h2{font-size:28px;letter-spacing:-.03em}.pi p{margin:3px 0}.pi small{color:var(--mute)}
.pi>div:nth-child(2){flex:1;min-width:180px;padding-bottom:6px}
/* art */
.art{position:absolute;inset:0;background-size:180% 180%;animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{to{background-position:100% 100%}}
.r0{background-image:linear-gradient(135deg,#a8c4e0,#d9c8e8)}
.r1{background-image:linear-gradient(135deg,#b5dcc9,#a8c4e0)}
.r2{background-image:linear-gradient(135deg,#f1d3b8,#e8bfc8)}
.r3{background-image:linear-gradient(135deg,#c8d4f0,#b5dcc9)}
/* chats */
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side h1{font-size:26px;font-weight:800;letter-spacing:-.04em;padding:16px 20px 8px}
.search{margin:0 16px 8px}
.search input{width:100%;padding:11px 16px;border-radius:22px;border:1px solid var(--line);background:var(--in);color:var(--ink);outline:0}
.list{overflow:auto;padding:4px 8px 14px;flex:1}
.c{display:flex;gap:12px;align-items:center;width:100%;padding:10px 12px;border-radius:12px;text-align:left;transition:.2s}
.c:hover{background:var(--hover);transform:translateX(4px)}
.c.on{background:var(--ink);color:var(--bg)}.c.on .pv,.c.on small{color:var(--bg);opacity:.7}.c.on .av{outline:2px solid var(--bg)}
.meta{flex:1;min-width:0}
.nm{font-weight:600;display:flex;justify-content:space-between;gap:8px}.nm small{font-weight:400;color:var(--mute);font-size:12px}
.pv{color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.c.un .pv{color:var(--ink);font-weight:600}.c.on.un .pv{color:var(--bg)}
.bd{background:var(--ink);color:var(--bg);font-size:12px;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 6px;animation:pop .4s cubic-bezier(.3,1.8,.5,1)}
.c.on .bd{background:var(--bg);color:var(--ink)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.hd{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}
.hd .back{display:none}.hd b{font-size:17px;display:block}.hd .s{font-size:13px;color:var(--mute)}.sp{flex:1}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:17px;transition:.25s}
.ib:hover{background:var(--hover);transform:rotate(15deg)}
.msgs{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:4px;scroll-behavior:smooth}
.day{align-self:center;font-size:12px;color:var(--mute);margin:6px 0 12px}
.m{max-width:min(70%,460px);padding:10px 15px;line-height:1.4;font-size:15.5px;position:relative;word-wrap:break-word;animation:in .35s cubic-bezier(.2,1.2,.4,1) both;cursor:pointer}
.m.them{align-self:flex-start;background:var(--in);border-radius:20px 20px 20px 6px;transform-origin:left bottom}
.m.me{align-self:flex-end;color:var(--bg);background:var(--ink);border-radius:20px 20px 6px 20px;transform-origin:right bottom}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.7)}}
.m time{display:block;font-size:11px;opacity:0;max-height:0;transition:.25s}
.m:hover time,.m.sh time{opacity:.7;max-height:16px;margin-top:3px}
.rx{position:absolute;bottom:-12px;font-size:14px;background:var(--panel);color:var(--ink);border:1.5px solid var(--ink);border-radius:12px;padding:0 6px;animation:pop .4s cubic-bezier(.3,1.8,.5,1)}
.me .rx{left:8px}.them .rx{right:8px}.m.hr{margin-bottom:14px}
.pick{position:absolute;top:-46px;display:flex;gap:2px;background:var(--panel);color:var(--ink);border:2px solid var(--ink);border-radius:22px;padding:4px 6px;z-index:3;animation:pop .25s cubic-bezier(.3,1.8,.5,1)}
.me .pick{right:0}.them .pick{left:0}
.pick button{font-size:20px;border-radius:50%;width:34px;height:34px;transition:.15s}.pick button:hover{transform:scale(1.35) translateY(-4px)}
.typ{align-self:flex-start;background:var(--in);border-radius:20px 20px 20px 6px;padding:14px 16px;display:flex;gap:5px;animation:in .3s both}
.typ i{width:8px;height:8px;border-radius:50%;background:var(--mute);animation:b 1s infinite}.typ i:nth-child(2){animation-delay:.15s}.typ i:nth-child(3){animation-delay:.3s}
@keyframes b{40%{transform:translateY(-6px);background:var(--ink)}}
.bar{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);align-items:center;position:relative}
.bar input{flex:1;padding:12px 18px;border-radius:24px;border:1px solid var(--line);background:var(--in);color:var(--ink);outline:0}
.send{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:18px;display:grid;place-items:center;transition:.25s}
.send:hover{transform:scale(1.1) rotate(-12deg)}.send:active{transform:scale(.88)}.send.fly{animation:fly .5s}
@keyframes fly{40%{transform:translate(8px,-8px) scale(.9) rotate(-30deg)}}
.emo{position:absolute;bottom:68px;left:16px;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;background:var(--panel);border:2px solid var(--ink);border-radius:16px;padding:8px;animation:pop .25s cubic-bezier(.3,1.5,.5,1);transform-origin:bottom left;z-index:4}
.emo button{font-size:22px;width:38px;height:38px;border-radius:10px}.emo button:hover{background:var(--hover)}
.empty{margin:auto;color:var(--mute);text-align:center}
/* reels */
.reels{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;width:min(100%,430px);margin:0 auto;border-inline:1px solid #333;scrollbar-width:none}
.reel{height:100%;scroll-snap-align:start;position:relative;overflow:hidden;background:#1d242d}
.reel::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,#1d242dd9)}
.reel.paused .art,.reel.paused .pb i{animation-play-state:paused}
.rt{position:absolute;top:16px;left:18px;z-index:3;font-weight:800;font-size:24px;letter-spacing:-.04em;background:#1d242dcc;padding:2px 12px;border-radius:12px}
.pb{position:absolute;top:0;left:0;right:0;height:5px;background:#fff4;z-index:3}.pb i{display:block;height:100%;width:0;background:#fff}
.reel.act .pb i{animation:fill 8s linear forwards}@keyframes fill{to{width:100%}}
.cap{position:absolute;left:16px;right:84px;bottom:22px;z-index:3}
.cap .u{display:flex;gap:10px;align-items:center;font-weight:600;margin-bottom:8px}
.cap .av{width:38px;height:38px;font-size:13px;border:2px solid #fff;background:#000;color:#fff}.cap .av::after{display:none}
.fol{border:1.5px solid #fff;border-radius:14px;padding:3px 12px;font-size:13px;transition:.2s}.fol.on,.fol:hover{background:#fff;color:#000}
.cap p{background:#1d242dcc;display:inline;padding:3px 8px;border-radius:8px;line-height:1.8;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.ra{position:absolute;right:12px;bottom:26px;z-index:3;display:flex;flex-direction:column;gap:14px;align-items:center}
.ra button{display:flex;flex-direction:column;align-items:center;gap:2px;background:#1d242dcc;border:1.5px solid #ffffffaa;border-radius:30px;padding:10px 0;width:52px;font-size:12px;transition:.2s;color:#fff}
.ra button span{font-size:22px;line-height:1}.ra button:hover{transform:scale(1.08)}.ra button.on{background:#fff;color:#000}.ra button.on span{animation:heart .5s}
.big,.pz{position:absolute;left:50%;top:45%;z-index:4;pointer-events:none}
.big{font-size:110px;color:#fff;animation:big .8s both}
@keyframes big{0%{transform:translate(-50%,-50%) scale(0);opacity:1}40%{transform:translate(-50%,-50%) scale(1.2)}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
.pz{font-size:34px;background:#000;border:2px solid #fff;border-radius:50%;width:84px;height:84px;display:grid;place-items:center;animation:pz .7s both;color:#fff}
@keyframes pz{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
/* alerts */
.nt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:13px 14px;border-radius:12px;transition:.2s;position:relative;animation:pin .4s both;margin-bottom:4px}
.nt:hover{background:var(--hover);transform:translateX(4px)}
.nt.un{border:2px solid var(--ink)}
.nt.un::after{content:"";position:absolute;right:16px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--ink);}
@keyframes pulse{50%{transform:scale(1.5);opacity:.4}}
.nt small{color:var(--mute);display:block;margin-top:2px}
.gh{font-weight:800;margin:14px 0 8px}
.vt{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.vt h1{font-size:26px;letter-spacing:-.04em}
/* modal, toast */
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;animation:vin .2s both}
.md{background:var(--panel);color:var(--ink);border-radius:14px;width:min(430px,100%);max-height:100%;overflow:auto;box-shadow:0 12px 40px #0006;animation:pop .3s cubic-bezier(.3,1.4,.5,1);border:1px solid var(--line)}
.mh{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.mh h2{font-size:26px;letter-spacing:-.03em}.mh small{color:var(--mute)}
.mb{padding:16px;display:flex;flex-wrap:wrap;gap:10px}
.fld{flex:1 1 100%;display:block}.fld.half{flex:1 1 40%}.fld span{font-size:13px;color:var(--mute);display:block;margin-bottom:4px}
.mb .er,.mb .btn{flex:1 1 100%}
.toast{position:fixed;top:68px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:24px;z-index:200;font-weight:600;font-size:14px;animation:toast 3s both;pointer-events:none;white-space:nowrap}
@keyframes toast{0%{transform:translate(-50%,-90px)}10%,85%{transform:translate(-50%,0)}100%{transform:translate(-50%,-90px)}}
:root[data-pal="sage"][data-theme="light"]{--bg:#e9f0e8;--panel:#f7faf5;--ink:#2f4a3a;--mute:#6f8577;--line:#d5e0d3;--in:#e1ebdf;--hover:#d9e6d6}
:root[data-pal="sage"][data-theme="dark"]{--bg:#141b16;--panel:#1b241e;--ink:#d6e6da;--mute:#8aa092;--line:#2a372e;--in:#232e26;--hover:#293630}
:root[data-pal="sand"][data-theme="light"]{--bg:#f3ede1;--panel:#fbf7ee;--ink:#4a3f2f;--mute:#8a7d68;--line:#e4dac6;--in:#ece4d3;--hover:#e6dcc8}
:root[data-pal="sand"][data-theme="dark"]{--bg:#1c1812;--panel:#252017;--ink:#eadfc9;--mute:#a39679;--line:#383023;--in:#2d271c;--hover:#342d20}
:root[data-pal="lilac"][data-theme="light"]{--bg:#efeaf5;--panel:#faf8fd;--ink:#43395c;--mute:#7e7496;--line:#ddd5ea;--in:#e8e1f1;--hover:#e1d9ee}
